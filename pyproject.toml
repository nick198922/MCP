[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradedesk-mcp"
version = "0.1.0"
description = "Personal trading-desk MCP server: crypto perps/futures, options, prediction markets, risk and strategy tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.2",
  "httpx>=0.27",
  "pydantic>=2.7",
  "ccxt>=4.4",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
tradedesk-mcp = "tradedesk.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tradedesk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
