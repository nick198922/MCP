[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradedesk-mcp"
version = "0.1.0"
description = "Personal trading-desk MCP server: crypto perps/futures, options, prediction markets, risk and strategy tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.2",
  "httpx>=0.27",
  "pydantic>=2.7",
  "ccxt>=4.4",
  "numpy>=1.26",
  "aiosqlite>=0.19",
  "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
tradedesk-mcp = "tradedesk.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tradedesk"]

[tool.hatch.build.targets.wheel.force-include]
"src/tradedesk/prompts/token_deep_analysis.md" = "tradedesk/prompts/token_deep_analysis.md"
"src/tradedesk/prompts/fomc_playbook.md" = "tradedesk/prompts/fomc_playbook.md"
"src/tradedesk/prompts/pre_trade_checklist.md" = "tradedesk/prompts/pre_trade_checklist.md"
"src/tradedesk/prompts/morning_briefing.md" = "tradedesk/prompts/morning_briefing.md"
"src/tradedesk/data/macro_events.json" = "tradedesk/data/macro_events.json"
"src/tradedesk/data/alert_rules.example.json" = "tradedesk/data/alert_rules.example.json"
"src/tradedesk/data/events_seed.json" = "tradedesk/data/events_seed.json"
"src/tradedesk/data/rules_presets.json" = "tradedesk/data/rules_presets.json"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "B008", "UP037", "UP040"]
